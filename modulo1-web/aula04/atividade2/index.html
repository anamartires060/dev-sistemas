<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>🔎 Buscar usuário do GitHub</h1>

        <div class="search">
            <input 
                type="text" 
                id="username" 
                placeholder="Digite o usuário do GitHub"
            >
            <button id="searchButton">Buscar</button>
        </div>

        <div id="message"></div>

        <section id="profile" class="profile hidden">
            <img id="avatar" src="" alt="Foto do usuário">

            <h2 id="name"></h2>
            <p id="login"></p>
            <p id="bio"></p>

            <div class="info">
                <p>👥 Seguidores: <span id="followers"></span></p>
                <p>👤 Seguindo: <span id="following"></span></p>
                <p>📦 Repositórios: <span id="repositories"></span></p>
            </div>

            <a id="githubLink" href="" target="_blank">
                Ver perfil no GitHub
            </a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

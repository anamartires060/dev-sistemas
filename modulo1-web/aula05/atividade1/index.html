<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Consulta de CEP</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: linear-gradient(180deg, #4facfe, #00f2fe);
            color: white;
        }

        input, button {
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            border: none;
        }

        #resultado {
            margin-top: 20px;
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: left;
        }
    </style>
</head>

<body>

    <h1>Consulta de CEP</h1>

    <input 
        type="text" 
        id="cep" 
        placeholder="Digite o CEP"
        maxlength="9"
    >

    <button id="buscar">Buscar</button>

    <div id="resultado"></div>

    <script src="script.js"></script>

</body>
</html>
